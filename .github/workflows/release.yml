name: release

# Builds the Windows and Linux packages and publishes them as a GitHub release
# on tib-kpl/MetroidPrimePort. Push a tag (`git tag v0.13.0 && git push origin
# v0.13.0`), or start it from the Actions tab with the tag to release; a tag
# that does not exist yet is created on the commit the run was started from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.13.0)
        required: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  linux:
    uses: ./.github/workflows/linux-release.yml

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: tib-kpl/MetroidPrimePort
      TAG: ${{ inputs.tag || github.ref_name }}
      # A tag push is a pre-release while the port is in alpha.
      PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir release
          (cd artifacts/metroid_prime_port-windows && zip -qr "$GITHUB_WORKSPACE/release/metroid-prime-port-windows-x86_64.zip" .)
          cp artifacts/metroid_prime_port-linux/* release/
          ls -l release

      - name: Publish
        run: |
          flags=(--generate-notes --title "$TAG")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release/* --repo "$REPO" --target "$GITHUB_SHA" "${flags[@]}"
          fi
