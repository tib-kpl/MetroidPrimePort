name: CI

# One workflow for every push to the port branch: builds and tests the Windows
# and Linux packages, builds the Android APK, and publishes all of them as a
# GitHub release on tib-kpl/MetroidPrimePort, tagged build-<run number>.
#
# The APK is signed with the project's key when these two repository secrets
# are set, and with the shared debug key otherwise (fine for sideloading, but
# Android will not update a debug-signed install with a properly signed one):
#   MP_APK_KEYSTORE_BASE64     the keystore file, base64-encoded
#   MP_APK_KEYSTORE_PASSWORD   its password, which is also the key's
# The key's alias is metroid-prime-port, as tools/make_android_keystore.sh makes it.
on:
  push:
    branches: [port]
  workflow_dispatch:

# Pushes often arrive a few minutes apart; only the newest one is released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-clangcl

      # Configure downloads and unpacks about a dozen dependencies. Keep the
      # unpacked sources and the stamps that say they are current; the build
      # directories beside them are left out, since ccache covers those.
      - uses: actions/cache@v4
        with:
          path: |
            build-win/_deps/*-src
            build-win/_deps/*-subbuild
          key: deps-windows-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build-win -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAURORA_ENABLE_TESTS=ON
          -DMP_BUILD_TESTS=ON
          -DBUILD_SHARED_LIBS=OFF
          -DAURORA_SDL3_PROVIDER=vendor
          -DAURORA_SDL3_LINKAGE=static
          -DAURORA_NOD_LINKAGE=static
          -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build
        run: cmake --build build-win -j

      - name: Test
        run: ctest --test-dir build-win -L port --output-on-failure

      # ctest only prints a test's output when it fails, so the wss:// evidence
      # - the verified handshake and the rejections - would otherwise never
      # appear in the log. Run it once more directly to record it.
      - name: Show the TLS handshake result
        run: ./build-win/port_ws_tests.exe

      - name: Build FIFO regressions
        run: cmake --build build-win --target gx_fifo_tests -j

      - name: Test FIFO regressions
        run: ./build-win/extern/aurora/tests/gx_fifo_tests.exe --gtest_brief=1

      # The Remastered import decodes that game's H.264 movies with ffmpeg, run
      # as a separate program, and Windows has none of its own. The package
      # carries a small LGPL build made here from the official source: the
      # H.264 decoder and the JPEG encoder, nothing else. Rebuilt only when
      # the script changes.
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ffmpeg-min/out
          key: ffmpeg-min-${{ hashFiles('tools/build_ffmpeg_min.sh') }}

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          install: make diffutils tar xz curl mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm

      # Linked statically and on Win32 threads, so the program needs no
      # MinGW runtime DLL beside it.
      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          bash tools/build_ffmpeg_min.sh ffmpeg-min --disable-pthreads --enable-w32threads --extra-ldflags=-static
          mkdir -p ffmpeg-min/out
          cp ffmpeg-min/ffmpeg.exe ffmpeg-min/COPYING.LGPLv2.1 ffmpeg-min/ffmpeg-build.txt ffmpeg-min/out/

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-win/metroid_prime_port.exe dist/
          # The European disc's executable: the first hands that disc over to it.
          Copy-Item build-win/metroid_prime_port_eur.exe dist/
          Get-ChildItem build-win/*.dll | Copy-Item -Destination dist/
          if (Test-Path build-win/metroid_prime_port.pdb) { Copy-Item build-win/metroid_prime_port.pdb dist/ }
          if (Test-Path build-win/metroid_prime_port_eur.pdb) { Copy-Item build-win/metroid_prime_port_eur.pdb dist/ }
          # SDL3, zlib, libpng, nod and the runner's OpenSSL are linked into the
          # exe (see Configure); only Dawn's DLLs, which it loads itself, ship.
          $include = (Select-String -Path build-win/CMakeCache.txt -Pattern '^OPENSSL_INCLUDE_DIR:[A-Z]+=(.+)$').Matches[0].Groups[1].Value
          if (-not $include -or $include.EndsWith('-NOTFOUND')) { throw 'OpenSSL not found: wss:// would be disabled' }
          $root = Split-Path $include
          # The button-prompt textures and the pipeline cache seed are built into
          # the executable (MP_EMBED_RESOURCES), so the zip carries no copies.
          New-Item -ItemType Directory -Force -Path dist/licenses | Out-Null
          # The port's own grant and notice travel with the package too.
          Copy-Item LICENSE dist/licenses/port-license.txt
          Copy-Item NOTICE dist/licenses/port-notice.txt
          Copy-Item extern/aurora/LICENSE dist/licenses/aurora.txt
          Copy-Item extern/musyx/LICENSE dist/licenses/musyx.txt
          Copy-Item extern/astcenc/LICENSE.txt dist/licenses/astcenc.txt
          Copy-Item docs/NATIVE_PORT.md dist/README.md
          # ffmpeg is its own program under the LGPL: its licence, and where
          # its source and build line are, go with it.
          Copy-Item ffmpeg-min/out/ffmpeg.exe dist/
          Copy-Item ffmpeg-min/out/COPYING.LGPLv2.1 dist/licenses/ffmpeg-LGPL-2.1.txt
          Copy-Item ffmpeg-min/out/ffmpeg-build.txt dist/licenses/ffmpeg.txt
          # Keep notices supplied by the fetched runtime packages too.
          Get-ChildItem build-win/_deps -Recurse -File -Include LICENSE*,COPYING*,NOTICE* |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path build-win/_deps), $_.FullName)
              $destination = Join-Path dist/licenses $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination
            }
          # nod is now linked in: ship its licence (dual MIT / Apache-2.0).
          Invoke-WebRequest https://raw.githubusercontent.com/encounter/nod/v2.0.0-alpha.12/LICENSE-MIT -OutFile dist/licenses/nod-MIT.txt
          Invoke-WebRequest https://raw.githubusercontent.com/encounter/nod/v2.0.0-alpha.12/LICENSE-APACHE -OutFile dist/licenses/nod-Apache-2.0.txt
          $license = @("$root/license.txt", "$root/LICENSE.txt") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($license) { Copy-Item $license dist/licenses/openssl.txt }
          else { Invoke-WebRequest https://raw.githubusercontent.com/openssl/openssl/openssl-3.5/LICENSE.txt -OutFile dist/licenses/openssl.txt }

      # Fail if a library that should be static is imported as a DLL again.
      - name: Check the executable's imports
        shell: pwsh
        run: |
          $imports = & dumpbin /dependents dist/metroid_prime_port.exe
          $imports
          $bad = $imports | Select-String -Pattern '^\s*(SDL3|zlib1|zlib-ng\d*|libpng\d*|nod|libssl-3-x64|libcrypto-3-x64)\.dll' -AllMatches
          if ($bad) { throw "Executable imports DLLs that should be static: $bad" }

      # The runner has OpenSSL and other runtimes on PATH, which hid a DLL
      # missing from the package. Start it with the system directories only, as
      # a player's machine would.
      - name: Check packaged startup
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # The bundled ffmpeg must start the same way, and be the build the
          # movie import needs.
          $decoders = & ./dist/ffmpeg.exe -hide_banner -decoders
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ffmpeg did not start' }
          if (-not ($decoders | Select-String -Pattern '\bh264\b')) { throw 'Packaged ffmpeg has no H.264 decoder' }
          # With no disc the game opens a file dialog, which nobody answers
          # here: it used to hold the job for its whole five minute timeout.
          $env:MP_NO_DISC_DIALOG = "1"
          $process = Start-Process -FilePath ./dist/metroid_prime_port.exe -WorkingDirectory ./dist -Wait -PassThru -RedirectStandardError ./startup-error.log
          if ($process.ExitCode -ne 1) { throw "Unexpected exit code: $($process.ExitCode)" }
          if (-not (Select-String -Path ./startup-error.log -Pattern 'no disc image given')) { throw 'Packaged executable did not reach main' }
          # The run above left its log and caches in dist. Ship none of them:
          # copied over an install, a cache file without its old -wal/-shm
          # reads as malformed and feeds Dawn bad pipeline blobs.
          Remove-Item -Force -ErrorAction SilentlyContinue ./dist/metroid_prime_port.log, ./dist/dawn_cache.db*, ./dist/pipeline_cache.db*

      - uses: actions/upload-artifact@v4
        with:
          name: metroid_prime_port-windows
          path: dist

  linux:
    runs-on: ubuntu-24.04
    container: almalinux:9
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      MAX_GLIBC: "2.34"
      MAX_GLIBCXX: "3.4.29"
    steps:
      - name: Dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ \
            cmake ninja-build git curl file findutils binutils python3 \
            alsa-lib-devel pulseaudio-libs-devel libX11-devel libXext-devel \
            libXrandr-devel libXcursor-devel libXi-devel libXfixes-devel \
            libXScrnSaver-devel libXtst-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel mesa-libEGL-devel mesa-libGL-devel \
            freetype-devel libpng-devel zlib-devel bzip2-devel brotli-devel \
            libzstd-devel openssl-devel ccache
      - uses: actions/checkout@v4
        with:
          # The version string is `git describe`; it needs the tags.
          fetch-depth: 0
      # ccache keeps the objects between runs, and the unpacked dependency
      # sources skip the downloads in Configure, as in the windows job.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - uses: actions/cache@v4
        with:
          path: |
            build/port-gcc/_deps/*-src
            build/port-gcc/_deps/*-subbuild
          key: deps-linux-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source /opt/rh/gcc-toolset-14/enable
          cmake -S . -B build/port-gcc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DAURORA_ENABLE_TESTS=OFF -DMP_BUILD_TESTS=ON
      - name: Build
        run: |
          source /opt/rh/gcc-toolset-14/enable
          cmake --build build/port-gcc -j 4
          ccache -s
      - name: Test
        run: ctest --test-dir build/port-gcc -L port --output-on-failure
      - name: Check the glibc and libstdc++ floor
        run: |
          bin=build/port-gcc/metroid_prime_port
          "$bin" --version
          too_new() {  # $1 = prefix, $2 = highest allowed version
            objdump -T "$bin" | grep -oE "\($1_[0-9.]+\)" | tr -d '()' | sort -Vu |
              awk -F_ '{ print $NF }' |
              while read -r v; do
                [ "$(printf '%s\n%s\n' "$v" "$2" | sort -V | tail -1)" = "$2" ] || echo "$1_$v"
              done
          }
          bad="$(too_new GLIBC "$MAX_GLIBC")$(too_new GLIBCXX "$MAX_GLIBCXX")$(too_new CXXABI 1.3.13)"
          if [ -n "$bad" ]; then
            echo "symbol versions newer than the floor:" >&2
            echo "$bad" >&2
            objdump -T "$bin" | grep -E "$(echo $bad | tr ' ' '|')" >&2
            exit 1
          fi
          echo "needs at most glibc $MAX_GLIBC, GLIBCXX $MAX_GLIBCXX"
      - name: Package
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash tools/make_appimage.sh build/port-gcc build/appimage
          d=build/release/metroid-prime-port-linux-x86_64
          mkdir -p "$d/share/licenses/metroid-prime-port"
          cp build/port-gcc/metroid_prime_port build/port-gcc/metroid_prime_port_eur "$d/"
          cp LICENSE NOTICE "$d/share/licenses/metroid-prime-port/"
          tar -C build/release -czf build/release/metroid-prime-port-linux-x86_64.tar.gz \
            metroid-prime-port-linux-x86_64
          mv build/appimage/MetroidPrime-x86_64.AppImage build/release/
      - uses: actions/upload-artifact@v4
        with:
          name: metroid_prime_port-linux
          path: |
            build/release/MetroidPrime-x86_64.AppImage
            build/release/metroid-prime-port-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # The disc layer is nod, in Rust, cross-compiled for the device.
      - name: Rust for Android
        run: rustup target add aarch64-linux-android
      # The NDK and CMake versions android/app/build.gradle asks for.
      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;29.0.14206865" "cmake;3.31.5" "platforms;android-34" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cxx-android-${{ github.sha }}
          restore-keys: cxx-android-
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MP_APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MP_APK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # A secret pasted from Windows can end in CR LF: drop whitespace, then decode.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            {
              echo "MP_APK_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "MP_APK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MP_APK_KEY_ALIAS=metroid-prime-port"
              echo "MP_APK_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No MP_APK_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
          fi
      - name: Build
        run: GRADLE="$(command -v gradle)" sh tools/android_apk.sh :app:assembleRelease
      - name: Package
        run: |
          mkdir -p build/release
          cp android/app/build/outputs/apk/release/app-release.apk \
            build/release/metroid-prime-port-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: metroid_prime_port-android
          path: build/release/metroid-prime-port-android-arm64.apk

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: tib-kpl/MetroidPrimePort
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir release
          (cd artifacts/metroid_prime_port-windows && zip -qr "$GITHUB_WORKSPACE/release/metroid-prime-port-windows-x86_64.zip" .)
          cp artifacts/metroid_prime_port-linux/* artifacts/metroid_prime_port-android/* release/
          ls -l release
      - name: Publish
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          printf 'Built from %s.\n\n%s\n' "$GITHUB_SHA" "$MESSAGE" > notes.md
          gh release create "$TAG" release/* --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} ($short)" --notes-file notes.md --latest
